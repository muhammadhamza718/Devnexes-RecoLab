[pytest]
markers =
    full_dataset: Tests that require the full MovieLens dataset (not run in CI)
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src/recolab
    --cov-report=term-missing
    --cov-report=html